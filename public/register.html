<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pupil Sign In · Year 6 English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-scene" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="langSlot" class="lang-fixed"></div>
  <div class="wrap" style="max-width: 540px; margin-top: 32px;">
    <div class="card">
      <h2 style="margin: 0 0 8px; font-size: 1.0625rem;" data-i18n="reg.title">Open your homework</h2>

      <div id="pageMsg"></div>

      <!-- Step 2: pick name + personal PIN -->
      <section id="step2" hidden>
        <div id="step2msg"></div>
        <p class="small muted" id="className" style="margin: 8px 0 10px;"></p>

        <p class="small" style="margin: 0 0 6px;"><b>1.</b> <span data-i18n="reg.step1">Find and tap your name.</span></p>
        <div id="names" class="reglist" style="margin-bottom: 14px;"></div>
        <p class="small" style="margin: 0 0 12px;"><b>2.</b> <span data-i18n="reg.step2">Enter your own 6-digit PIN from your teacher.</span></p>
        <form id="regForm">
          <label class="field"><span data-i18n="reg.regCode">Your 6-digit PIN</span>
            <input type="text" id="regCode" data-i18n-placeholder="reg.regCodePh" placeholder="6-digit PIN" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
          </label>
          <button class="btn block" type="submit" id="regBtn" data-i18n="reg.create">Open my homework</button>
        </form>
      </section>

      <!-- Step 3: success -->
      <section id="step3" hidden>
        <div class="state" style="padding: 28px 16px;">
          <h3 style="margin: 0 0 4px; font-size: 1rem;" data-i18n="reg.done">You're signed in</h3>
          <p id="welcomeName" style="font-weight: 600; margin: 4px 0;"></p>
          <p class="small muted" style="margin: 0 0 12px;" data-i18n="reg.doneHelp">Opening your homework now.</p>
          <a class="btn" href="/student.html" data-i18n="reg.go">Go to my homework</a>
        </div>
      </section>

      <p class="small mt" style="margin-bottom: 0;"><a href="/" data-i18n="common.back">← Back</a></p>
    </div>
  </div>

  <script type="module">
    import { api, el, clear, alertBox } from './js/common.js';
    import { t, tServer, applyI18n, langToggle } from './js/i18n.js';

    document.getElementById('langSlot').append(langToggle());
    applyI18n();

    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const pageMsg = document.getElementById('pageMsg');
    const step2msg = document.getElementById('step2msg');

    let pupils = [];
    let selectedId = null;
    const invite = new URLSearchParams(location.hash.slice(1));
    const invitedId = Number(invite.get('pupil')) || null;
    const invitedPin = invite.get('pin');
    if (invitedPin && /^\d{6}$/.test(invitedPin)) document.getElementById('regCode').value = invitedPin;
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);

    // The teacher link supplies the class internally; pupils never type or see it.
    const initialCode = new URLSearchParams(location.search).get('class');

    async function loadClass() {
      pageMsg.innerHTML = '';
      try {
        if (!initialCode) throw new Error(t('reg.qrOnly'));
        const data = await api('/api/register/' + encodeURIComponent(initialCode.trim().toUpperCase()));
        pupils = data.pupils;
        if (invitedId) {
          const invited = pupils.find(p => p.id === invitedId);
          if (!invited) throw new Error(t('reg.invalidQr'));
          pupils = [invited];
          selectedId = invited.id;
        }
        document.getElementById('className').textContent = t('reg.classPrefix') + data.className;
        renderNames();
        step2.hidden = false;
        if (invitedId && /^\d{6}$/.test(invitedPin || '')) document.getElementById('regForm').requestSubmit();
      } catch (err) {
        pageMsg.append(alertBox('info', tServer(err.message)));
      }
    }

    function renderNames() {
      const box = document.getElementById('names');
      clear(box);
      for (const p of pupils) {
        const btn = el('button', {
          type: 'button',
          class: 'regname' + (p.registered ? ' taken' : '') + (selectedId === p.id ? ' sel' : ''),
          onclick: () => { selectedId = p.id; renderNames(); },
        },
          el('span', {}, p.name + (p.sameName ? ` · ${p.studentNo}` : '')),
          p.registered ? el('span', { class: 'tag' }, t('reg.taken')) : el('span', { class: 'tag' }, p.studentNo),
        );
        box.append(btn);
      }
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      step2msg.innerHTML = '';
      if (!selectedId) {
        step2msg.append(alertBox('error', t('reg.pickFirst')));
        return;
      }
      const btn = document.getElementById('regBtn');
      btn.disabled = true; btn.textContent = t('reg.creating');
      try {
        const r = await api('/api/auth/qr-login', { method: 'POST', body: {
          pin: regCode.value.trim(),
          pupilId: selectedId,
        }});
        document.getElementById('welcomeName').textContent = t('reg.welcomePrefix') + r.displayName + '!';
        step2.hidden = true;
        step3.hidden = false;
        location.replace('/student.html');
      } catch (err) {
        step2msg.append(alertBox('error', tServer(err.message)));
        try {
          const data = await api('/api/register/' + encodeURIComponent(initialCode.trim().toUpperCase()));
          pupils = data.pupils;
          if (invitedId) pupils = pupils.filter(p => p.id === invitedId);
          renderNames();
        } catch { /* keep current list */ }
        btn.disabled = false; btn.textContent = t('reg.create');
      }
    });
    loadClass();
  </script>
</body>
</html>
