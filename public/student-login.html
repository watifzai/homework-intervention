<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pupil Login · Year 6 English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-scene" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="langSlot" class="lang-fixed"></div>
  <div class="wrap" style="max-width: 400px; margin-top: 64px;">
    <div class="card">
      <h2 style="margin: 0 0 12px; font-size: 1.0625rem;" data-i18n="login.pupilTitle">Pupil login</h2>
      <div id="msg"></div>
      <form id="loginForm">
        <label class="field"><span data-i18n="common.username">Username</span>
          <input type="text" id="username" autocomplete="username" required>
        </label>
        <label class="field"><span data-i18n="common.password">Password</span>
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <button class="btn block" type="submit" data-i18n="common.signIn">Sign in</button>
      </form>
      <button class="btn secondary block" id="demoBtn" data-i18n="login.demoBtn" hidden>Temporary demo access</button>
      <p class="small muted center" id="demoNote" data-i18n="login.demoNote" style="margin: 8px 0 0;" hidden></p>
      <p class="small muted mt"><span data-i18n="login.newHere">New here? </span><a href="/register.html" data-i18n="login.registerLink">Register with your class code</a></p>
      <p class="small" style="margin-bottom: 0;"><a href="/" data-i18n="common.back">← Back</a></p>
    </div>
  </div>
  <script type="module">
    import { api, alertBox } from './js/common.js';
    import { t, tServer, applyI18n, langToggle } from './js/i18n.js';
    document.getElementById('langSlot').append(langToggle());
    applyI18n();

    // Temporary demo access: one click into a demo pupil, 2-hour session.
    const demoBtn = document.getElementById('demoBtn');
    const demoNote = document.getElementById('demoNote');
    fetch('/api/demo-status').then((r) => r.json()).then((st) => {
      if (st.pupil) { demoBtn.hidden = false; demoNote.hidden = false; }
    }).catch(() => { /* stay hidden when demo data is absent */ });
    demoBtn.addEventListener('click', async () => {
      demoBtn.disabled = true;
      try {
        const r = await api('/api/auth/demo-login', { method: 'POST', body: { as: 'pupil' } });
        location.href = r.role === 'teacher' ? '/teacher.html' : '/student.html';
      } catch (err) {
        msg.append(alertBox('error', tServer(err.message)));
        demoBtn.disabled = false;
      }
    });

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = t('common.signingIn');
      try {
        const r = await api('/api/auth/login', { method: 'POST', body: {
          username: username.value, password: password.value,
        }});
        location.href = r.role === 'teacher' ? '/teacher.html' : '/student.html';
      } catch (err) {
        msg.append(alertBox('error', tServer(err.message)));
        btn.disabled = false; btn.textContent = t('common.signIn');
      }
    });
  </script>
</body>
</html>
