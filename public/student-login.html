<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pupil Login · Year 6 English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-scene" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="langSlot" class="lang-fixed"></div>
  <div class="wrap" style="max-width: 400px; margin-top: 64px;">
    <div class="card">
      <h2 style="margin: 0 0 12px; font-size: 1.0625rem;" data-i18n="login.pupilTitle">Pupil login</h2>
      <p class="small muted" data-i18n="login.pinHelp">Enter the six-digit PIN from your personal card.</p>
      <div id="msg"></div>
      <form id="loginForm">
        <label class="field"><span data-i18n="login.pinLabel">Your six-digit PIN</span>
          <input type="text" id="pin" class="code-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="••••••" required>
        </label>
        <button class="btn block" type="submit" data-i18n="common.signIn">Sign in</button>
      </form>
      <p class="small" style="margin-bottom: 0;"><a href="/" data-i18n="common.back">← Back</a></p>
    </div>
  </div>
  <script type="module">
    import { api, alertBox } from './js/common.js';
    import { t, tServer, applyI18n, langToggle } from './js/i18n.js';
    document.getElementById('langSlot').append(langToggle());
    applyI18n();

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const pinInput = document.getElementById('pin');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = t('common.signingIn');
      try {
        await api('/api/auth/pin-login', { method: 'POST', body: { pin: pinInput.value.trim() } });
        location.href = '/student.html';
      } catch (err) {
        msg.append(alertBox('error', tServer(err.message)));
        btn.disabled = false; btn.textContent = t('common.signIn');
      }
    });
    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
      if (pinInput.value.length === 6) form.requestSubmit();
    });
  </script>
</body>
</html>
